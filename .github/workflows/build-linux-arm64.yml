name: Build tvheadend Linux arm64

on:
  workflow_dispatch:
    inputs:
      extra_configure:
        description: '额外 configure 选项（空格分隔，可留空，如 --enable-hdhomerun_client）'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
  schedule:
    # 每日 01:00 UTC（北京时间 09:00）定时构建，构建成功后由
    # release.yml 发布到当天的 build-YYYYMMDD Release（同日覆盖）
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  build-linux-arm64:
    name: Build Linux arm64 (aarch64)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出当前仓库源码
        uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config wget python3 gettext gzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          aarch64-linux-gnu-gcc --version
          node --version; npm --version

      # tvheadend 硬依赖 OpenSSL 与 zlib。两者都交叉编译成静态库放在
      # /tmp/arm64-libs，随后用 PKG_CONFIG_LIBDIR 完全替换 pkg-config 默认
      # 搜索路径——host x86_64 的 .pc 一个都不可见，configure 的 check_pkg
      # 只能命中 arm64 静态库，链接时 -lssl/-lcrypto/-lz 全部落到 .a 上，
      # 产物对目标盒子的运行时依赖只剩 glibc 自身。
      # （方案对齐 oscam-patched build-linux-arm64.yml 的 libusb 静态交叉
      # 编译模式。）
      - name: 交叉编译 ARM64 版 zlib（静态）
        run: |
          cd /tmp
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            ./configure --prefix=/tmp/arm64-libs --static
          make -j$(nproc)
          make install

          # zlib 不生成 .pc，手写一个供 tvheadend configure 的 check_pkg zlib 使用
          mkdir -p /tmp/arm64-libs/lib/pkgconfig
          cat > /tmp/arm64-libs/lib/pkgconfig/zlib.pc << 'EOF'
          prefix=/tmp/arm64-libs
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: zlib
          Description: zlib compression library
          Version: 1.3.1
          Libs: -L${libdir} -lz
          Cflags: -I${includedir}
          EOF
          ls -la /tmp/arm64-libs/lib/ /tmp/arm64-libs/lib/pkgconfig/

      - name: 交叉编译 ARM64 版 OpenSSL（静态）
        run: |
          cd /tmp
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz
          tar -xf openssl-3.0.15.tar.gz
          cd openssl-3.0.15
          ./Configure linux-aarch64 \
            --cross-compile-prefix=aarch64-linux-gnu- \
            no-shared no-tests \
            --prefix=/tmp/arm64-libs \
            --openssldir=/tmp/arm64-libs/ssl
          make -j$(nproc) build_libs
          make install_sw
          ls -la /tmp/arm64-libs/lib/ | head
          test -f /tmp/arm64-libs/lib/libssl.a
          test -f /tmp/arm64-libs/lib/libcrypto.a
          test -f /tmp/arm64-libs/lib/pkgconfig/openssl.pc
          test -f /tmp/arm64-libs/lib/pkgconfig/libssl.pc

      # capmt/cwc/cccam/constcw 任一启用时 configure 强制要求 libdvbcsa
      # （configure:812-822，check_cc_header + check_cc_lib 双重检测，无
      # disable 出口——禁掉会导致解扰功能整体失效）。同样交叉编译为静态库。
      # 注意：dvbcsa 检测不走 pkg-config，靠 CFLAGS/LDFLAGS 环境变量把
      # /tmp/arm64-libs 的 include/lib 路径喂给 configure。
      - name: 交叉编译 ARM64 版 libdvbcsa（静态）
        run: |
          cd /tmp
          wget -q https://download.videolan.org/pub/videolan/libdvbcsa/1.1.0/libdvbcsa-1.1.0.tar.gz
          tar -xf libdvbcsa-1.1.0.tar.gz
          cd libdvbcsa-1.1.0
          # 1.1.0 (2013) 的 config.sub/guess 太老，不认识 aarch64 三元组，
          # 先换成 savannah 最新版（失败时回落 gcc-mirror）
          curl -fsSL -o config.sub https://git.savannah.gnu.org/cgit/config.git/plain/config.sub \
            || curl -fsSL -o config.sub https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub
          curl -fsSL -o config.guess https://git.savannah.gnu.org/cgit/config.git/plain/config.guess \
            || curl -fsSL -o config.guess https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess
          ./configure \
            --host=aarch64-linux-gnu \
            --prefix=/tmp/arm64-libs \
            --disable-shared --enable-static
          make -j$(nproc)
          make install
          test -f /tmp/arm64-libs/lib/libdvbcsa.a
          test -f /tmp/arm64-libs/include/dvbcsa/dvbcsa.h

      # 说明：
      # - --nowerror=1：交叉环境警告不可控，关掉 -Werror
      # - 转码外链库（libav/x264/x265/vpx/theora/vorbis/opus/fdkaac/vaapi）
      #   全部禁用：DTMB 场景走 passthrough，识别与解扰不依赖它们，
      #   也避免为每个转码库再做一轮 arm64 交叉编译
      # - libav/ffmpeg_static 本身是 auto，PKG_CONFIG_LIBDIR 隔离后自然
      #   检测不到，这里显式 disable 是防 runner 预装包漏网
      # - vue_build:auto：runner 自带 node/npm，Vite 构建跑在 host 上，
      #   产物是纯静态 JS/CSS，与目标架构无关
      # - 产物为动态链接 glibc 的 arm64 ELF（tvheadend 无法全静态），
      #   全静态链接（-static），不依赖目标设备的 glibc 版本
      - name: 配置 tvheadend（交叉编译）
        env:
          EXTRA_CONFIGURE: ${{ inputs.extra_configure }}
        run: |
          export PKG_CONFIG_LIBDIR=/tmp/arm64-libs/lib/pkgconfig
          export PKG_CONFIG_PATH=/tmp/arm64-libs/lib/pkgconfig
          # dvbcsa 检测不走 pkg-config（check_cc_header/check_cc_lib 直接
          # 编译测试程序），需要 include/lib 路径；环境变量会原样写入
          # .config.mk（CFLAGS += ${CFLAGS} / LDFLAGS += ${LDFLAGS}），
          # 编译与链接阶段同样生效
          # -static：对齐 oscam-patched 的全静态产物——zlib/OpenSSL/
          # libdvbcsa 已是静态 .a，glibc 2.34+ 的 pthread/dl/rt 均已并入
          # libc.a；静态二进制不再依赖目标设备 glibc 版本，任意发行版可用。
          # NSS（getaddrinfo/getpwnam）走 glibc 内置 files/dns 回退，无需
          # 目标机 NSS 模块；dlsym(RTLD_DEFAULT) 探测 dvbcsa_bs_key_set_ecm
          # 失败时回退 dvbcsa_bs_key_set（tvhcsa.c:333-335），功能无损。
          export CFLAGS="-I/tmp/arm64-libs/include"
          export LDFLAGS="-L/tmp/arm64-libs/lib -static"

          # shellcheck disable=SC2086
          ./configure \
            --arch=aarch64 \
            --cpu=cortex-a53 \
            --cc=aarch64-linux-gnu-gcc \
            --nowerror=1 \
            --disable-pie \
            --disable-ccache \
            --disable-avahi \
            --disable-dbus_1 \
            --disable-pcre \
            --disable-pcre2 \
            --disable-uriparser \
            --disable-libav \
            --disable-ffmpeg_static \
            --disable-libx264 --disable-libx264_static \
            --disable-libx265 --disable-libx265_static \
            --disable-libvpx --disable-libvpx_static \
            --disable-libtheora --disable-libtheora_static \
            --disable-libvorbis --disable-libvorbis_static \
            --disable-libfdkaac --disable-libfdkaac_static \
            --disable-libopus --disable-libopus_static \
            --disable-vaapi \
            --disable-nvenc \
            --disable-hdhomerun_client \
            --disable-hdhomerun_server \
            --disable-hdhomerun_static \
            --enable-zlib \
            $EXTRA_CONFIGURE

          echo "=== .config.mk 关键项 ==="
          grep -E "^ARCH|^CC|LDFLAGS|CONFIG_ZLIB|CONFIG_SSL" .config.mk | head

      - name: 交叉编译 tvheadend
        run: |
          make -j$(nproc)

      - name: 验证交叉编译产物
        run: |
          ls -la build.linux/tvheadend
          file build.linux/tvheadend
          echo "=== 检查 ELF 架构 ==="
          aarch64-linux-gnu-readelf -h build.linux/tvheadend | grep -E "Class|Machine|Flags"
          echo "=== 动态依赖（无 NEEDED = 全静态，可在任意 glibc 版本运行） ==="
          aarch64-linux-gnu-readelf -d build.linux/tvheadend | grep NEEDED || echo "(no NEEDED entries — fully static)"
          echo "=== 确认 OpenSSL/zlib/dvbcsa 已静态链入（符号抽查） ==="
          aarch64-linux-gnu-nm build.linux/tvheadend | grep -c "SSL_" || true
          aarch64-linux-gnu-nm build.linux/tvheadend | grep -c "dvbcsa_bs" || true

      # 按 debian/ 官方打包内容组装 arm64 deb：service/default/copyright
      # 直接复用上游文件；postinst/prerm/postrm 为 debconf-free 简化版
      # （官方版靠 debconf 交互写 superuser 管理员凭据，这里不预置凭据，
      # 首次访问 Web UI 由 tvheadend 自带的 admin 创建向导完成）。
      # dpkg-deb 只打元数据与文件树，host x86_64 可直接产出 arm64 包。
      - name: 打包 deb（Debian 12 arm64）
        run: |
          VERSION="4.3-$(date +%Y%m%d)"
          DEBROOT=/tmp/debroot
          rm -rf "$DEBROOT"
          install -d "$DEBROOT/DEBIAN" \
                    "$DEBROOT/usr/bin" \
                    "$DEBROOT/usr/share/doc/tvheadend" \
                    "$DEBROOT/lib/systemd/system" \
                    "$DEBROOT/etc/default"

          # 二进制（0755）与文档
          install -m 0755 build.linux/tvheadend "$DEBROOT/usr/bin/tvheadend"
          cp debian/copyright "$DEBROOT/usr/share/doc/tvheadend/copyright"

          # 官方原样文件
          cp debian/tvheadend.service "$DEBROOT/lib/systemd/system/tvheadend.service"
          cp debian/tvheadend.default "$DEBROOT/etc/default/tvheadend"

          # ---- DEBIAN 元数据 ----
          cat > "$DEBROOT/DEBIAN/control" << EOF
          Package: tvheadend
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: arm64
          Maintainer: Tvheadend Project <debian@tvheadend.org>
          Depends: adduser, init-system-helpers
          Recommends: xmltv-util
          Homepage: https://tvheadend.org
          Description: Tvheadend TV streaming server and DVR
           Tvheadend is a TV streaming server and digital video recorder.
           - supports DVB-S(2)/T(2)/C, ISDB-S/T/C, ATSC-T/C, DTMB, IPTV, SAT>IP, HDHomeRun
           - this build adds China DTMB AVS+/AVS2/AVS3 video and DRA audio
             stream identification (see manhere/tvheadend master)
          EOF

          cat > "$DEBROOT/DEBIAN/conffiles" << EOF
          /etc/default/tvheadend
          EOF

          cat > "$DEBROOT/DEBIAN/postinst" << 'EOF'
          #!/bin/sh
          set -e

          # 简化自 debian/tvheadend.postinst：创建系统用户与配置目录，
          # 启用 systemd 服务；不写 superuser 凭据文件（首访 Web UI 时
          # 由 tvheadend 的 admin 创建向导完成初始化）。
          HTS_USER="hts"

          case "$1" in
            configure)
              if ! getent passwd "$HTS_USER" >/dev/null; then
                adduser --quiet --system --group --home /var/lib/tvheadend "$HTS_USER"
              fi
              HTS_HOMEDIR="$(getent passwd "$HTS_USER" | cut -d':' -f6)"
              HTS_UID="$(getent passwd "$HTS_USER" | cut -d':' -f3)"
              HTS_GID="$(getent passwd "$HTS_USER" | cut -d':' -f4)"
              install -d -o "$HTS_UID" -g "$HTS_GID" /var/lib/tvheadend
              install -d -o "$HTS_UID" -g "$HTS_GID" "$HTS_HOMEDIR/recordings"
              if [ -x /bin/systemctl ] && [ -d /run/systemd/system ]; then
                systemctl daemon-reload >/dev/null || true
                systemctl enable tvheadend.service >/dev/null || true
              fi
              ;;
          esac
          exit 0
          EOF

          cat > "$DEBROOT/DEBIAN/prerm" << 'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = remove -o "$1" = upgrade ] && \
             [ -x /bin/systemctl ] && [ -d /run/systemd/system ]; then
            systemctl stop tvheadend.service >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          cat > "$DEBROOT/DEBIAN/postrm" << 'EOF'
          #!/bin/sh
          set -e
          # 简化自 debian/tvheadend.postrm
          if [ "$1" = purge ]; then
            deluser --system hts || true
            rm -rf /var/lib/tvheadend
          fi
          if [ -x /bin/systemctl ]; then
            systemctl daemon-reload >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          chmod 0755 "$DEBROOT/DEBIAN"/postinst "$DEBROOT/DEBIAN"/prerm "$DEBROOT/DEBIAN"/postrm

          dpkg-deb --root-owner-group --build "$DEBROOT" \
            "build.linux/tvheadend_${VERSION}_arm64.deb"
          dpkg-deb --info "build.linux/tvheadend_${VERSION}_arm64.deb"
          dpkg-deb --contents "build.linux/tvheadend_${VERSION}_arm64.deb"

      - name: 上传构建产物
        # 构建产物始终上传（便于测试性构建也能下载二进制）。
        uses: actions/upload-artifact@v4
        with:
          name: tvheadend-linux-arm64
          path: |
            build.linux/tvheadend
            build.linux/tvheadend_*.deb
          retention-days: 30
